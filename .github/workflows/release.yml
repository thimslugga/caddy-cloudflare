---
name: Release image

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  publish:
    name: Publish image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install project tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Validate release version
        id: release
        shell: bash
        run: |
          caddy_version="$(<CADDY_VERSION)"
          release_tag="${GITHUB_REF_NAME}"

          if [[ ! "${caddy_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid CADDY_VERSION value: %s\n' "${caddy_version}" >&2
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-r([1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %s\n' "${release_tag}" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${caddy_version}" ]]; then
            printf 'Tag Caddy version %s does not match CADDY_VERSION %s\n' \
              "${BASH_REMATCH[1]}" "${caddy_version}" >&2
            exit 1
          fi

          {
            printf 'caddy_version=%s\n' "${caddy_version}"
            printf 'image_version=%s\n' "${release_tag#v}"
            printf 'created=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.image_version }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          build-args: |
            BUILD_DATE=${{ steps.release.outputs.created }}
            CADDY_VERSION=${{ steps.release.outputs.caddy_version }}
            IMAGE_VERSION=${{ steps.release.outputs.image_version }}
            VCS_REF=${{ github.sha }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          push-to-registry: true
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

      - name: Scan published immutable image
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: >-
          trivy image
          --exit-code 1
          --ignore-unfixed
          --no-progress
          --scanners vuln
          --severity HIGH,CRITICAL
          "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Update stable image tags
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          CADDY_VERSION: ${{ steps.release.outputs.caddy_version }}
        shell: bash
        run: |
          major_version="${CADDY_VERSION%%.*}"
          minor_version="${CADDY_VERSION%.*}"

          for tag in "${CADDY_VERSION}" "${minor_version}" "${major_version}" latest; do
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}@${IMAGE_DIGEST}"
          done

      - name: Create GitHub Release
        env:
          CADDY_VERSION: ${{ steps.release.outputs.caddy_version }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists\n' "${GITHUB_REF_NAME}"
            exit 0
          fi

          cloudflare_version="$(sed -n \
            's/^ARG CLOUDFLARE_PLUGIN_VERSION=//p' Dockerfile)"
          security_version="$(sed -n \
            's/^ARG CADDY_SECURITY_VERSION=//p' Dockerfile)"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          {
            printf '## Container image\n\n'
            printf -- '- Image: %s:%s\n' "${IMAGE_NAME}" "${IMAGE_VERSION}"
            printf -- '- Digest: %s\n' "${IMAGE_DIGEST}"
            printf -- '- Platforms: linux/amd64, linux/arm64\n'
            printf -- '- Caddy: %s\n' "${CADDY_VERSION}"
            printf -- '- Cloudflare DNS: %s\n' "${cloudflare_version}"
            printf -- '- caddy-security: %s\n' "${security_version}"
          } > "${notes_file}"

          gh release create "${GITHUB_REF_NAME}" \
            --notes-file "${notes_file}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --verify-tag

      - name: Summarize published digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
        shell: bash
        run: |
          {
            printf '%s\n\n' '### Published image'
            printf '%s\n' "- Image: \`${IMAGE_NAME}:${IMAGE_VERSION}\`"
            printf '%s\n' "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
