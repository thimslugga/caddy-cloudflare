---
name: Release image

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  publish:
    name: Publish image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Validate release version
        id: release
        shell: bash
        run: |
          caddy_version="$(<CADDY_VERSION)"
          release_tag="${GITHUB_REF_NAME}"

          if [[ ! "${caddy_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid CADDY_VERSION value: %s\n' "${caddy_version}" >&2
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-r([1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %s\n' "${release_tag}" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${caddy_version}" ]]; then
            printf 'Tag Caddy version %s does not match CADDY_VERSION %s\n' \
              "${BASH_REMATCH[1]}" "${caddy_version}" >&2
            exit 1
          fi

          {
            printf 'caddy_version=%s\n' "${caddy_version}"
            printf 'image_version=%s\n' "${release_tag#v}"
            printf 'created=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.image_version }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            BUILD_DATE=${{ steps.release.outputs.created }}
            CADDY_VERSION=${{ steps.release.outputs.caddy_version }}
            IMAGE_VERSION=${{ steps.release.outputs.image_version }}
            VCS_REF=${{ github.sha }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

      - name: Scan published immutable image
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: >-
          trivy image
          --exit-code 1
          --ignore-unfixed
          --no-progress
          --scanners vuln
          --severity HIGH,CRITICAL
          "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Update stable image tags
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          CADDY_VERSION: ${{ steps.release.outputs.caddy_version }}
        shell: bash
        run: |
          major_version="${CADDY_VERSION%%.*}"
          minor_version="${CADDY_VERSION%.*}"

          for tag in "${CADDY_VERSION}" "${minor_version}" "${major_version}" latest; do
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}@${IMAGE_DIGEST}"
          done

      - name: Create GitHub Release
        env:
          CADDY_VERSION: ${{ steps.release.outputs.caddy_version }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists\n' "${GITHUB_REF_NAME}"
            exit 0
          fi

          cloudflare_version="$(sed -n \
            's/^ARG CLOUDFLARE_PLUGIN_VERSION=//p' Dockerfile)"
          security_version="$(sed -n \
            's/^ARG CADDY_SECURITY_VERSION=//p' Dockerfile)"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          {
            printf '## Container image\n\n'
            printf -- '- Image: %s:%s\n' "${IMAGE_NAME}" "${IMAGE_VERSION}"
            printf -- '- Digest: %s\n' "${IMAGE_DIGEST}"
            printf -- '- Platforms: linux/amd64, linux/arm64\n'
            printf -- '- Caddy: %s\n' "${CADDY_VERSION}"
            printf -- '- Cloudflare DNS: %s\n' "${cloudflare_version}"
            printf -- '- caddy-security: %s\n' "${security_version}"
          } > "${notes_file}"

          gh release create "${GITHUB_REF_NAME}" \
            --notes-file "${notes_file}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --verify-tag

      - name: Summarize published digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
        shell: bash
        run: |
          {
            printf '%s\n\n' '### Published image'
            printf '%s\n' "- Image: \`${IMAGE_NAME}:${IMAGE_VERSION}\`"
            printf '%s\n' "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
