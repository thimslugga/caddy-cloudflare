# .vale.ini - Vale: https://docs.vale.sh/topics/installation

StylesPath = docs/styles

MinAlertLevel = warning

# https://vale.sh/generator
# https://github.com/tbhb/vale-ai-tells
Packages = \
    https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
    https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, \
    https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
    https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip, \
    https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells-commits.zip

[*.{html,md,txt}]
BasedOnStyles = Vale, Google, write-good, proselint, ai-tells
# These rules reject product names and clear technical prose used by the project.
Google.Headings = NO
Vale.Spelling = NO
write-good.Passive = NO
write-good.TooWordy = NO

[formats]
COMMIT_EDITMSG = md

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
ai-tells.SycophancyMarkers = NO
ai-tells.ClosingPleasantries = NO
